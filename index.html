<script>
/* ==========================================================
   QEVRI SUPABASE CONNECTION
   ========================================================== */

const SUPABASE_URL =
  "https://thijdkyjgzxnwwdzdyil.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_rTNzWNRC8zmx8J7KSJXviQ_1GgmmXQ6";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ==========================================================
   QEVRI PRODUCT DATABASE
   ========================================================== */

let products = [];


/* ==========================================================
   LOAD PRODUCTS FROM SUPABASE
   ========================================================== */

async function loadProductsFromSupabase() {

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("is_published", true)
      .order("created_at", {
        ascending: false
      });

  if (error) {

    console.error(
      "Supabase products error:",
      error
    );

    return;
  }

  products =
    (data || []).map(product => ({

      id:
        product.id,

      name:
        product.name,

      retailer:
        product.retailer,

      url:
        product.product_url,

      affiliateUrl:
        product.affiliate_url || "",

      category:
        product.category,

      price:
        Number(product.price || 0),

      oldPrice:
        Number(product.old_price || 0),

      rating:
        product.rating
          ? `★★★★★ ${product.rating}`
          : "",

      emoji:
        "🛍️",

      image:
        product.image_url || "",

      deal:
        !!product.is_deal,

      trending:
        !!product.is_trending,

      featured:
        !!product.is_featured

    }));


  renderProducts();

  renderDeals();

}


/* ==========================================================
   QEVRI STATE
   ========================================================== */

let wishlist = [];

let comparison = [];

let currentStep = 1;


/* ==========================================================
   ESCAPE HTML
   ========================================================== */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==========================================================
   PRODUCT CARD
   ========================================================== */

function createProductCard(product) {

  const safeName =
    escapeHtml(
      product.name
    );

  const safeRetailer =
    escapeHtml(
      product.retailer
    );

  const safeRating =
    escapeHtml(
      product.rating || ""
    );


  const image =
    product.image

      ? `
        <img
          src="${escapeHtml(product.image)}"
          alt="${safeName}"
          loading="lazy"
        >
      `

      : escapeHtml(
          product.emoji || "🛍️"
        );


  const targetUrl =
    product.affiliateUrl ||
    product.url ||
    "#";


  return `

    <div class="product">

      <div class="product-image">

        ${image}


        <button

          class="heart ${
            wishlist.includes(product.name)
              ? "active"
              : ""
          }"

          onclick="
            toggleWishlist(
              ${JSON.stringify(product.name)}
            )
          "

          aria-label="Add to wishlist"

        >

          ${
            wishlist.includes(product.name)
              ? "♥"
              : "♡"
          }

        </button>

      </div>


      <div class="product-info">


        <div class="retailer">

          ${safeRetailer}

        </div>


        <h3>

          ${safeName}

        </h3>


        <div class="rating">

          ${safeRating}

        </div>


        <div class="price-row">

          <span class="price">

            ₹${Number(
              product.price || 0
            ).toLocaleString("en-IN")}

          </span>


          ${
            product.oldPrice
              ? `
                <span class="old-price">

                  ₹${Number(
                    product.oldPrice
                  ).toLocaleString("en-IN")}

                </span>
              `
              : ""
          }

        </div>


        <div class="product-actions">


          <button

            class="small-btn"

            onclick="
              addCompare(
                ${JSON.stringify(product.name)}
              )
            "

          >

            Compare

          </button>


          <button

            class="small-btn primary"

            onclick="
              visitRetailer(
                ${JSON.stringify(targetUrl)},
                ${JSON.stringify(product.retailer)}
              )
            "

          >

            View at ${safeRetailer}

          </button>


        </div>


      </div>

    </div>

  `;

}


/* ==========================================================
   RENDER PRODUCTS
   ========================================================== */

function renderProducts(
  list = products
) {

  const grid =
    document.getElementById(
      "productGrid"
    );


  if (!grid) {
    return;
  }


  if (!list.length) {

    grid.innerHTML = `

      <p
        style="
          grid-column:1/-1;
          text-align:center;
          color:#777;
          padding:40px;
        "
      >

        No products found.

      </p>

    `;

    return;

  }


  grid.innerHTML =
    list
      .map(
        createProductCard
      )
      .join("");

}


/* ==========================================================
   RENDER DEALS
   ========================================================== */

function renderDeals() {

  const grid =
    document.getElementById(
      "dealGrid"
    );


  if (!grid) {
    return;
  }


  const deals =
    products.filter(
      product =>
        product.deal
    );


  if (!deals.length) {

    grid.innerHTML = `

      <p
        style="
          grid-column:1/-1;
          text-align:center;
          color:#777;
          padding:40px;
        "
      >

        No deals available yet.

      </p>

    `;

    return;

  }


  grid.innerHTML =
    deals
      .map(
        createProductCard
      )
      .join("");

}


/* ==========================================================
   SEARCH
   ========================================================== */

function searchProducts() {

  const input =
    document.getElementById(
      "searchInput"
    );


  if (!input) {
    return;
  }


  const query =
    input.value
      .toLowerCase()
      .trim();


  if (!query) {

    renderProducts(
      products
    );

    return;

  }


  const results =
    products.filter(
      product =>

        String(
          product.name || ""
        )
        .toLowerCase()
        .includes(query)

        ||

        String(
          product.category || ""
        )
        .toLowerCase()
        .includes(query)

        ||

        String(
          product.retailer || ""
        )
        .toLowerCase()
        .includes(query)
    );


  renderProducts(
    results
  );

}


/* ==========================================================
   CATEGORY FILTER
   ========================================================== */

function filterCategory(
  category
) {

  const results =
    products.filter(
      product =>
        product.category === category
    );


  const trending =
    document.getElementById(
      "trending"
    );


  if (trending) {

    trending.scrollIntoView({
      behavior: "smooth"
    });

  }


  renderProducts(
    results
  );

}


/* ==========================================================
   CLEAR FILTER
   ========================================================== */

function clearFilter() {

  const search =
    document.getElementById(
      "searchInput"
    );


  if (search) {

    search.value = "";

  }


  renderProducts(
    products
  );

}


/* ==========================================================
   SEARCH BUTTON
   ========================================================== */

function focusSearch() {

  const search =
    document.getElementById(
      "searchInput"
    );


  if (!search) {
    return;
  }


  search.focus();


  window.scrollTo({

    top: 400,

    behavior: "smooth"

  });

}


/* ==========================================================
   WISHLIST
   ========================================================== */

function toggleWishlist(
  name
) {

  if (
    wishlist.includes(name)
  ) {

    wishlist =
      wishlist.filter(
        item =>
          item !== name
      );


    showToast(
      "Removed from wishlist"
    );

  }

  else {

    wishlist.push(name);


    showToast(
      "Added to wishlist ♥"
    );

  }


  renderProducts();

  renderDeals();

}


function showWishlist() {

  if (!wishlist.length) {

    showToast(
      "Your wishlist is empty"
    );

    return;

  }


  showToast(

    wishlist.length +

    " item" +

    (
      wishlist.length > 1
        ? "s"
        : ""
    ) +

    " in your wishlist ♥"

  );

}


/* ==========================================================
   COMPARE
   ========================================================== */

function addCompare(
  name
) {

  if (
    !comparison.includes(name)
  ) {

    comparison.push(name);


    if (
      comparison.length > 4
    ) {

      comparison.shift();

    }


    showToast(
      name +
      " added to comparison"
    );

  }

  else {

    showToast(
      "Already added to comparison"
    );

  }

}


/* ==========================================================
   RETAILER LINK
   ========================================================== */

function visitRetailer(
  url,
  retailer
) {

  if (
    !url ||
    url === "#"
  ) {

    showToast(
      "Product link is not available yet."
    );

    return;

  }


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}


/* ==========================================================
   QEVRI MATCH
   ========================================================== */

function openMatch() {

  currentStep = 1;


  const modal =
    document.getElementById(
      "matchModal"
    );


  if (!modal) {
    return;
  }


  modal.classList.add(
    "show"
  );


  updateSteps();

}


function closeMatch() {

  const modal =
    document.getElementById(
      "matchModal"
    );


  if (modal) {

    modal.classList.remove(
      "show"
    );

  }

}


function selectOption(
  button
) {

  const parent =
    button.parentElement;


  parent
    .querySelectorAll(
      ".option"
    )
    .forEach(
      option => {

        option.classList.remove(
          "selected"
        );

      }
    );


  button.classList.add(
    "selected"
  );

}


function updateSteps() {

  document
    .querySelectorAll(
      ".step"
    )
    .forEach(
      step => {

        step.classList.toggle(

          "active",

          Number(
            step.dataset.step
          ) === currentStep

        );

      }
    );


  const prev =
    document.getElementById(
      "prevBtn"
    );


  const next =
    document.getElementById(
      "nextBtn"
    );


  if (prev) {

    prev.style.display =
      currentStep > 1
        ? "block"
        : "none";

  }


  if (next) {

    next.style.display =
      currentStep < 5
        ? "block"
        : "none";

  }

}


function nextStep() {

  if (
    currentStep < 5
  ) {

    currentStep++;

    updateSteps();

  }

}


function previousStep() {

  if (
    currentStep > 1
  ) {

    currentStep--;

    updateSteps();

  }

}


/* ==========================================================
   TOAST
   ========================================================== */

function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  if (!toast) {
    return;
  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    2500
  );

}


/* ==========================================================
   CLOSE MATCH MODAL
   ========================================================== */

const matchModal =
  document.getElementById(
    "matchModal"
  );


if (matchModal) {

  matchModal.addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeMatch();

      }

    }
  );

}


/* ==========================================================
   INITIAL LOAD
   ========================================================== */

loadProductsFromSupabase();

</script>


<script>
/* ==========================================================
   QEVRI ADMIN LOGIN
   ========================================================== */

const QEVRI_ADMIN_UID =
  "9d00662a-c5d1-447a-b407-4ecc116a90b1";


async function adminLogin() {

  const email =
    document
      .getElementById(
        "adminEmail"
      )
      .value
      .trim();


  const password =
    document.getElementById(
      "adminPassword"
    ).value;


  const message =
    document.getElementById(
      "loginMessage"
    );


  if (
    !email ||
    !password
  ) {

    message.textContent =
      "Please enter your email and password.";

    return;

  }


  message.textContent =
    "Logging in...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email:
        email,

      password:
        password

    });


  if (error) {

    message.textContent =
      error.message;

    return;

  }


  if (
    !data.user ||
    data.user.id !== QEVRI_ADMIN_UID
  ) {

    await supabaseClient.auth.signOut();


    message.textContent =
      "This account is not authorized as a QEVRI admin.";

    return;

  }


  document.getElementById(
    "adminLogin"
  ).style.display =
    "none";


  document.getElementById(
    "adminDashboard"
  ).style.display =
    "block";


  message.textContent = "";


  loadAdminProducts();

}


async function checkAdminSession() {

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  const session =
    data.session;


  if (
    session &&
    session.user &&
    session.user.id === QEVRI_ADMIN_UID
  ) {

    document.getElementById(
      "adminLogin"
    ).style.display =
      "none";


    document.getElementById(
      "adminDashboard"
    ).style.display =
      "block";


    loadAdminProducts();

  }

}


async function adminLogout() {

  await supabaseClient.auth.signOut();


  document.getElementById(
    "adminDashboard"
  ).style.display =
    "none";


  document.getElementById(
    "adminLogin"
  ).style.display =
    "block";


  document.getElementById(
    "adminEmail"
  ).value = "";


  document.getElementById(
    "adminPassword"
  ).value = "";

}


function openAdmin() {

  document.getElementById(
    "adminPanel"
  ).style.display =
    "block";


  checkAdminSession();

}


function closeAdmin() {

  document.getElementById(
    "adminPanel"
  ).style.display =
    "none";

}


if (
  window.location.hash === "#admin"
) {

  openAdmin();

}

</script>


<script>
/* ==========================================================
   QEVRI PRODUCT MANAGEMENT
   ========================================================== */

async function saveProduct() {

  const message =
    document.getElementById(
      "productMessage"
    );


  message.textContent =
    "Saving product...";


  const productId =
    document.getElementById(
      "editProductId"
    ).value;


  const imageFile =
    document.getElementById(
      "productImage"
    ).files[0];


  let imageUrl = "";


  /* ========================================================
     UPLOAD IMAGE
     ======================================================== */

  if (imageFile) {

    const safeName =
      imageFile.name.replace(
        /[^a-zA-Z0-9.-]/g,
        "-"
      );


    const filePath =
      "products/" +
      Date.now() +
      "-" +
      safeName;


    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          filePath,
          imageFile
        );


    if (uploadError) {

      message.textContent =
        "Image upload failed: " +
        uploadError.message;

      return;

    }


    const {
      data: imageData
    } =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(
          filePath
        );


    imageUrl =
      imageData.publicUrl;

  }


  /* ========================================================
     PRODUCT DATA
     ======================================================== */

  const productData = {

    name:
      document
        .getElementById(
          "productName"
        )
        .value
        .trim(),


    description:
      document
        .getElementById(
          "productDescription"
        )
        .value
        .trim(),


    retailer:
      document
        .getElementById(
          "productRetailer"
        )
        .value
        .trim(),


    category:
      document
        .getElementById(
          "productCategory"
        )
        .value
        .trim(),


    price:
      Number(
        document
          .getElementById(
            "productPrice"
          )
          .value
      ) || null,


    old_price:
      Number(
        document
          .getElementById(
            "productOldPrice"
          )
          .value
      ) || null,


    rating:
      Number(
        document
          .getElementById(
            "productRating"
          )
          .value
      ) || null,


    review_count:
      Number(
        document
          .getElementById(
            "productReviewCount"
          )
          .value
      ) || 0,


    product_url:
      document
        .getElementById(
          "productURL"
        )
        .value
        .trim(),


    affiliate_url:
      document
        .getElementById(
          "productAffiliateURL"
        )
        .value
        .trim() || null,


    is_deal:
      document.getElementById(
        "productDeal"
      ).checked,


    is_trending:
      document.getElementById(
        "productTrending"
      ).checked,


    is_featured:
      document.getElementById(
        "productFeatured"
      ).checked,


    is_published:
      document.getElementById(
        "productPublished"
      ).checked,


    updated_at:
      new Date().toISOString()

  };


  if (imageUrl) {

    productData.image_url =
      imageUrl;

  }


  /* ========================================================
     INSERT OR UPDATE
     ======================================================== */

  let result;


  if (productId) {

    result =
      await supabaseClient
        .from("products")
        .update(
          productData
        )
        .eq(
          "id",
          productId
        );

  }

  else {

    result =
      await supabaseClient
        .from("products")
        .insert([
          productData
        ]);

  }


  if (result.error) {

    message.textContent =
      "Could not save product: " +
      result.error.message;

    return;

  }


  message.textContent =
    "Product saved successfully! ✓";


  clearProductForm();


  loadAdminProducts();


  /* Refresh public products */
  loadProductsFromSupabase();


  setTimeout(
    () => {

      message.textContent =
        "";

    },
    2500
  );

}


/* ==========================================================
   SHOW ADD PRODUCT
   ========================================================== */

function showAddProduct() {

  clearProductForm();


  document.getElementById(
    "productForm"
  ).style.display =
    "block";

}


/* ==========================================================
   CANCEL PRODUCT FORM
   ========================================================== */

function cancelProductForm() {

  clearProductForm();


  document.getElementById(
    "productForm"
  ).style.display =
    "none";

}


/* ==========================================================
   CLEAR PRODUCT FORM
   ========================================================== */

function clearProductForm() {

  document.getElementById(
    "editProductId"
  ).value = "";


  document.getElementById(
    "productName"
  ).value = "";


  document.getElementById(
    "productDescription"
  ).value = "";


  document.getElementById(
    "productRetailer"
  ).value = "";


  document.getElementById(
    "productCategory"
  ).value = "";


  document.getElementById(
    "productPrice"
  ).value = "";


  document.getElementById(
    "productOldPrice"
  ).value = "";


  document.getElementById(
    "productRating"
  ).value = "";


  document.getElementById(
    "productReviewCount"
  ).value = "";


  document.getElementById(
    "productURL"
  ).value = "";


  document.getElementById(
    "productAffiliateURL"
  ).value = "";


  document.getElementById(
    "productImage"
  ).value = "";


  document.getElementById(
    "productDeal"
  ).checked = false;


  document.getElementById(
    "productTrending"
  ).checked = false;


  document.getElementById(
    "productFeatured"
  ).checked = false;


  document.getElementById(
    "productPublished"
  ).checked = true;

}


/* ==========================================================
   LOAD ADMIN PRODUCTS
   ========================================================== */

async function loadAdminProducts() {

  const container =
    document.getElementById(
      "adminProducts"
    );


  container.innerHTML =
    "Loading products...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    container.innerHTML =
      "Could not load products: " +
      error.message;

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML =
      "<p>No products added yet.</p>";

    return;

  }


  container.innerHTML =
    data
      .map(
        product => `

          <div
            style="
              border:1px solid #ddd;
              padding:15px;
              margin:10px 0;
              border-radius:12px;
            "
          >

            <strong>
              ${escapeHtml(
                product.name
              )}
            </strong>

            <br>

            <small>

              ${escapeHtml(
                product.retailer || ""
              )}

              ·

              ₹${product.price || 0}

            </small>

            <br><br>

            <button
              onclick="
                editProduct(
                  ${product.id}
                )
              "
            >
              Edit
            </button>

            <button
              onclick="
                deleteProduct(
                  ${product.id}
                )
              "
            >
              Delete
            </button>

          </div>

        `
      )
      .join("");

}


/* ==========================================================
   EDIT PRODUCT
   ========================================================== */

async function editProduct(
  id
) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if (error) {

    alert(
      "Could not load product."
    );

    return;

  }


  document.getElementById(
    "editProductId"
  ).value =
    data.id;


  document.getElementById(
    "productName"
  ).value =
    data.name || "";


  document.getElementById(
    "productDescription"
  ).value =
    data.description || "";


  document.getElementById(
    "productRetailer"
  ).value =
    data.retailer || "";


  document.getElementById(
    "productCategory"
  ).value =
    data.category || "";


  document.getElementById(
    "productPrice"
  ).value =
    data.price || "";


  document.getElementById(
    "productOldPrice"
  ).value =
    data.old_price || "";


  document.getElementById(
    "productRating"
  ).value =
    data.rating || "";


  document.getElementById(
    "productReviewCount"
  ).value =
    data.review_count || "";


  document.getElementById(
    "productURL"
  ).value =
    data.product_url || "";


  document.getElementById(
    "productAffiliateURL"
  ).value =
    data.affiliate_url || "";


  document.getElementById(
    "productDeal"
  ).checked =
    !!data.is_deal;


  document.getElementById(
    "productTrending"
  ).checked =
    !!data.is_trending;


  document.getElementById(
    "productFeatured"
  ).checked =
    !!data.is_featured;


  document.getElementById(
    "productPublished"
  ).checked =
    !!data.is_published;


  document.getElementById(
    "productForm"
  ).style.display =
    "block";

}


/* ==========================================================
   DELETE PRODUCT
   ========================================================== */

async function deleteProduct(
  id
) {

  if (
    !confirm(
      "Delete this product?"
    )
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("products")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    alert(
      "Could not delete product: " +
      error.message
    );

    return;

  }


  loadAdminProducts();


  loadProductsFromSupabase();

}

</script>
