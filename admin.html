<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QEVRI Admin</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .box {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    p {
      color: #666;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .logout {
      background: #777;
      margin-left: 8px;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div class="box" id="loginBox">

    <h1>QEVRI Admin</h1>

    <p>Admin Login</p>

    <label for="email">Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      autocomplete="email"
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      autocomplete="current-password"
    >

    <button type="button" id="loginButton">
      Login
    </button>

    <div
      class="message"
      id="loginMessage">
    </div>

  </div>


  <!-- ADMIN DASHBOARD -->

  <div class="box hidden" id="adminBox">

    <h1>QEVRI Admin</h1>

    <p>Add a product to QEVRI.</p>

    <label for="name">Product Name</label>

    <input
      type="text"
      id="name"
      placeholder="Product name"
    >

    <label for="description">Description</label>

    <textarea
      id="description"
      placeholder="Product description"
    ></textarea>

    <label for="retailer">Retailer</label>

    <input
      type="text"
      id="retailer"
      placeholder="Amazon"
    >

    <label for="product_url">Product URL</label>

    <input
      type="url"
      id="product_url"
      placeholder="https://..."
    >

    <label for="affiliate_url">Affiliate URL</label>

    <input
      type="url"
      id="affiliate_url"
      placeholder="https://..."
    >

    <label for="image_url">Image URL</label>

    <input
      type="url"
      id="image_url"
      placeholder="https://..."
    >

    <label for="category">Category</label>

    <input
      type="text"
      id="category"
      placeholder="Fashion"
    >

    <label for="price">Price</label>

    <input
      type="number"
      id="price"
      step="0.01"
      placeholder="999"
    >

    <button type="button" id="addButton">
      Add Product
    </button>

    <button
      type="button"
      class="logout"
      id="logoutButton">
      Logout
    </button>

    <div
      class="message"
      id="message">
    </div>

  </div>


  <!-- JAVASCRIPT -->

  <script>

    /* =========================
       SUPABASE SETTINGS
    ========================= */

    const SUPABASE_URL =
      "https://thijdkyjgzxnwwdzdyil.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_rTNzWNRC8zmx8J7KSJXviQ_1GgmmXQ6";


    /* =========================
       CREATE SUPABASE CLIENT
    ========================= */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       ELEMENTS
    ========================= */

    const loginBox =
      document.getElementById("loginBox");

    const adminBox =
      document.getElementById("adminBox");

    const loginButton =
      document.getElementById("loginButton");

    const addButton =
      document.getElementById("addButton");

    const logoutButton =
      document.getElementById("logoutButton");


    /* =========================
       CHECK EXISTING LOGIN
    ========================= */

    async function checkLogin() {

      try {

        const result =
          await supabaseClient.auth.getSession();

        if (result.data.session) {

          showAdmin();

        }

      } catch (error) {

        console.error("Session error:", error);

      }

    }


    /* =========================
       LOGIN
    ========================= */

    async function login() {

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;

      const loginMessage =
        document.getElementById("loginMessage");


      if (!email || !password) {

        loginMessage.textContent =
          "Please enter your email and password.";

        return;

      }


      loginMessage.textContent =
        "Logging in...";


      loginButton.disabled = true;


      try {

        const result =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (result.error) {

          console.error(
            "Login error:",
            result.error
          );

          loginMessage.textContent =
            "Login failed: " +
            result.error.message;

          loginButton.disabled = false;

          return;

        }


        loginMessage.textContent =
          "Login successful!";


        showAdmin();


      } catch (error) {

        console.error(
          "Unexpected login error:",
          error
        );

        loginMessage.textContent =
          "Login error: " +
          error.message;

      }


      loginButton.disabled = false;

    }


    /* =========================
       SHOW ADMIN
    ========================= */

    function showAdmin() {

      loginBox.classList.add("hidden");

      adminBox.classList.remove("hidden");

    }


    /* =========================
       ADD PRODUCT
    ========================= */

    async function addProduct() {

      const message =
        document.getElementById("message");


      const name =
        document.getElementById("name")
          .value
          .trim();

      const description =
        document.getElementById("description")
          .value
          .trim();

      const retailer =
        document.getElementById("retailer")
          .value
          .trim();

      const product_url =
        document.getElementById("product_url")
          .value
          .trim();

      const affiliate_url =
        document.getElementById("affiliate_url")
          .value
          .trim();

      const image_url =
        document.getElementById("image_url")
          .value
          .trim();

      const category =
        document.getElementById("category")
          .value
          .trim();

      const price =
        document.getElementById("price")
          .value;


      if (
        !name ||
        !retailer ||
        !product_url ||
        !category
      ) {

        message.textContent =
          "Please fill Product Name, Retailer, Product URL and Category.";

        return;

      }


      message.textContent =
        "Adding product...";


      addButton.disabled = true;


      try {

        const result =
          await supabaseClient
            .from("products")
            .insert({

              name: name,

              description:
                description || null,

              retailer:
                retailer,

              product_url:
                product_url,

              affiliate_url:
                affiliate_url || null,

              image_url:
                image_url || null,

              category:
                category,

              price:
                price
                  ? Number(price)
                  : null

            });


        if (result.error) {

          console.error(
            "Product error:",
            result.error
          );

          message.textContent =
            "Error: " +
            result.error.message;

          addButton.disabled = false;

          return;

        }


        message.textContent =
          "✅ Product added successfully!";


        document.getElementById("name").value = "";

        document.getElementById("description").value = "";

        document.getElementById("retailer").value = "";

        document.getElementById("product_url").value = "";

        document.getElementById("affiliate_url").value = "";

        document.getElementById("image_url").value = "";

        document.getElementById("category").value = "";

        document.getElementById("price").value = "";


      } catch (error) {

        console.error(
          "Unexpected product error:",
          error
        );

        message.textContent =
          "Error: " +
          error.message;

      }


      addButton.disabled = false;

    }


    /* =========================
       LOGOUT
    ========================= */

    async function logout() {

      await supabaseClient.auth.signOut();

      adminBox.classList.add("hidden");

      loginBox.classList.remove("hidden");

      document.getElementById("loginMessage").textContent =
        "Logged out.";

    }


    /* =========================
       BUTTON EVENTS
    ========================= */

    loginButton.addEventListener(
      "click",
      login
    );

    addButton.addEventListener(
      "click",
      addProduct
    );

    logoutButton.addEventListener(
      "click",
      logout
    );


    /* =========================
       START
    ========================= */

    checkLogin();

  </script>

</body>
</html>
