<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QEVRI Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .box {
      width: 90%;
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #666;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .logout {
      background: #777;
      margin-left: 8px;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }

    #adminBox {
      display: none;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->

  <div class="box" id="loginBox">

    <h1>QEVRI Admin</h1>

    <p>Sign in to manage QEVRI products.</p>

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label for="password">Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button id="loginButton" type="button">
      Login
    </button>

    <div
      class="message"
      id="loginMessage">
    </div>

  </div>


  <!-- =========================
       ADMIN PRODUCT AREA
  ========================== -->

  <div class="box" id="adminBox">

    <h1>QEVRI Admin</h1>

    <p>Add a new product to QEVRI.</p>


    <label for="name">
      Product Name *
    </label>

    <input
      id="name"
      type="text"
      placeholder="Example: GoSriKi Women Kurta Set"
    >


    <label for="description">
      Description
    </label>

    <textarea
      id="description"
      placeholder="Enter product description"
    ></textarea>


    <div class="row">

      <div>

        <label for="retailer">
          Retailer *
        </label>

        <input
          id="retailer"
          type="text"
          placeholder="Amazon"
        >

      </div>


      <div>

        <label for="category">
          Category *
        </label>

        <input
          id="category"
          type="text"
          placeholder="Fashion"
        >

      </div>

    </div>


    <label for="product_url">
      Product URL *
    </label>

    <input
      id="product_url"
      type="url"
      placeholder="https://..."
    >


    <label for="affiliate_url">
      Affiliate URL
    </label>

    <input
      id="affiliate_url"
      type="url"
      placeholder="https://..."
    >


    <label for="image_url">
      Image URL
    </label>

    <input
      id="image_url"
      type="url"
      placeholder="https://..."
    >


    <div class="row">

      <div>

        <label for="price">
          Price
        </label>

        <input
          id="price"
          type="number"
          step="0.01"
          placeholder="999"
        >

      </div>


      <div>

        <label for="old_price">
          Old Price
        </label>

        <input
          id="old_price"
          type="number"
          step="0.01"
          placeholder="1499"
        >

      </div>

    </div>


    <label for="rating">
      Rating
    </label>

    <input
      id="rating"
      type="number"
      step="0.1"
      min="0"
      max="5"
      placeholder="4.5"
    >


    <label for="review_count">
      Review Count
    </label>

    <input
      id="review_count"
      type="number"
      placeholder="1250"
    >


    <button
      id="addButton"
      type="button">
      Add Product
    </button>

    <button
      id="logoutButton"
      class="logout"
      type="button">
      Logout
    </button>


    <div
      class="message"
      id="message">
    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /* SUPABASE */

    const SUPABASE_URL =
      "https://thijdkyjgzxnwwdzdyil.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_rTNzWNRC8zmx8J7KSJXviQ_1GgmmXQ6";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ELEMENTS */

    const loginBox =
      document.getElementById("loginBox");

    const adminBox =
      document.getElementById("adminBox");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const addButton =
      document.getElementById("addButton");


    /* HIDE ADMIN UNTIL LOGIN */

    adminBox.style.display = "none";


    /* LOGIN */

    loginButton.addEventListener(
      "click",
      async function () {

        const email =
          document.getElementById("email")
            .value
            .trim();

        const password =
          document.getElementById("password")
            .value;

        const loginMessage =
          document.getElementById("loginMessage");


        if (!email || !password) {

          loginMessage.textContent =
            "Please enter your email and password.";

          return;

        }


        loginMessage.textContent =
          "Logging in...";

        loginButton.disabled = true;


        try {

          const { data, error } =
            await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (error) {

            loginMessage.textContent =
              "Login failed: " +
              error.message;

            loginButton.disabled = false;

            return;

          }


          console.log(
            "Login successful:",
            data
          );


          loginBox.style.display =
            "none";

          adminBox.style.display =
            "block";


        } catch (error) {

          loginMessage.textContent =
            "Error: " +
            error.message;

          loginButton.disabled = false;

        }

      }
    );


    /* ADD PRODUCT */

    addButton.addEventListener(
      "click",
      async function () {

        const message =
          document.getElementById("message");


        const name =
          document.getElementById("name")
            .value
            .trim();

        const description =
          document.getElementById("description")
            .value
            .trim();

        const retailer =
          document.getElementById("retailer")
            .value
            .trim();

        const category =
          document.getElementById("category")
            .value
            .trim();

        const product_url =
          document.getElementById("product_url")
            .value
            .trim();

        const affiliate_url =
          document.getElementById("affiliate_url")
            .value
            .trim();

        const image_url =
          document.getElementById("image_url")
            .value
            .trim();

        const price =
          document.getElementById("price")
            .value;

        const old_price =
          document.getElementById("old_price")
            .value;

        const rating =
          document.getElementById("rating")
            .value;

        const review_count =
          document.getElementById("review_count")
            .value;


        /* REQUIRED */

        if (
          !name ||
          !retailer ||
          !category ||
          !product_url
        ) {

          message.textContent =
            "Please fill all fields marked with *.";

          return;

        }


        message.textContent =
          "Adding product...";

        addButton.disabled = true;


        try {

          const { error } =
            await supabaseClient
              .from("products")
              .insert({

                name: name,

                description:
                  description || null,

                retailer:
                  retailer,

                product_url:
                  product_url,

                affiliate_url:
                  affiliate_url || null,

                image_url:
                  image_url || null,

                category:
                  category,

                price:
                  price
                    ? Number(price)
                    : null,

                old_price:
                  old_price
                    ? Number(old_price)
                    : null,

                rating:
                  rating
                    ? Number(rating)
                    : null,

                review_count:
                  review_count
                    ? Number(review_count)
                    : null

              });


          if (error) {

            console.error(error);

            message.textContent =
              "Error: " +
              error.message;

            addButton.disabled = false;

            return;

          }


          message.textContent =
            "✅ Product added successfully!";


          /* CLEAR FORM */

          document.getElementById("name").value = "";

          document.getElementById("description").value = "";

          document.getElementById("retailer").value = "";

          document.getElementById("category").value = "";

          document.getElementById("product_url").value = "";

          document.getElementById("affiliate_url").value = "";

          document.getElementById("image_url").value = "";

          document.getElementById("price").value = "";

          document.getElementById("old_price").value = "";

          document.getElementById("rating").value = "";

          document.getElementById("review_count").value = "";


        } catch (error) {

          console.error(error);

          message.textContent =
            "Error: " +
            error.message;

        }


        addButton.disabled = false;

      }
    );


    /* LOGOUT */

    logoutButton.addEventListener(
      "click",
      async function () {

        await supabaseClient.auth.signOut();

        adminBox.style.display =
          "none";

        loginBox.style.display =
          "block";

        document.getElementById(
          "loginMessage"
        ).textContent = "";

      }
    );

  </script>

</body>
</html>
