<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QEVRI Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>QEVRI Admin</h1>

    <p>Sign in to your QEVRI admin account.</p>

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
      autocomplete="email"
    >

    <label for="password">Password</label>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton" type="button">
      Login
    </button>

    <div id="message"></div>

  </div>

  <script>
    const SUPABASE_URL =
      "https://thijdkyjgzxnwwdzdyil.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_fKXeJA4MtgPnPWHGKLb5Iw_FCTknjoo";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    loginButton.addEventListener("click", async function () {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        message.style.color = "#b42318";
        message.textContent =
          "Please enter your email and password.";
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      message.style.color = "#666";
      message.textContent = "Connecting to Supabase...";

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          console.error(error);

          message.style.color = "#b42318";
          message.textContent =
            "Login failed: " + error.message;

          loginButton.disabled = false;
          loginButton.textContent = "Login";
          return;
        }

        if (data.session) {

          message.style.color = "#16794b";
          message.textContent =
            "✅ Login successful! Supabase authentication is working.";

          loginButton.textContent = "Logged In";

        } else {

          message.style.color = "#b42318";
          message.textContent =
            "Login completed, but no session was created.";

          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }

      } catch (error) {

        console.error(error);

        message.style.color = "#b42318";
        message.textContent =
          "Connection error: " + error.message;

        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }

    });
  </script>

</body>
</html>
