<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QEVRI Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: #f5f5f7;
      background:
        radial-gradient(circle at 10% 10%, rgba(138, 92, 246, 0.20), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(0, 210, 255, 0.15), transparent 28%),
        radial-gradient(circle at 50% 90%, rgba(255, 0, 128, 0.12), transparent 30%),
        #07070b;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.22;
      pointer-events: none;
      z-index: -2;
    }

    body::before {
      background: #8b5cf6;
      top: -100px;
      left: -100px;
      animation: floatOne 12s ease-in-out infinite alternate;
    }

    body::after {
      background: #06b6d4;
      right: -100px;
      bottom: -100px;
      animation: floatTwo 15s ease-in-out infinite alternate;
    }

    @keyframes floatOne {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(100px, 80px) scale(1.25);
      }
    }

    @keyframes floatTwo {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(-100px, -80px) scale(1.2);
      }
    }

    /* Moving particles */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 12px rgba(255,255,255,0.35);
      animation: twinkle 4s ease-in-out infinite;
    }

    .star:nth-child(1) {
      top: 12%;
      left: 18%;
      animation-delay: 0s;
    }

    .star:nth-child(2) {
      top: 28%;
      left: 80%;
      animation-delay: 1s;
    }

    .star:nth-child(3) {
      top: 62%;
      left: 12%;
      animation-delay: 2s;
    }

    .star:nth-child(4) {
      top: 76%;
      left: 74%;
      animation-delay: 0.5s;
    }

    .star:nth-child(5) {
      top: 45%;
      left: 50%;
      animation-delay: 1.5s;
    }

    .star:nth-child(6) {
      top: 88%;
      left: 32%;
      animation-delay: 2.5s;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.8);
      }
    }

    .container {
      width: min(950px, 92%);
      margin: 45px auto;
    }

    .card {
      position: relative;
      background: rgba(18, 18, 27, 0.82);
      border: 1px solid rgba(255,255,255,0.09);
      padding: 30px;
      border-radius: 22px;
      box-shadow:
        0 25px 70px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      margin-bottom: 24px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.035),
        transparent 45%
      );
      pointer-events: none;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 4px;
      background: linear-gradient(
        90deg,
        #ffffff,
        #a78bfa,
        #67e8f9
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      color: #9ca3af;
      margin-top: 8px;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    h2 {
      font-size: 23px;
      margin-bottom: 22px;
    }

    p {
      color: #a1a1aa;
    }

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 7px;
      font-weight: 600;
      color: #e5e7eb;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      font-size: 15px;
      color: #f5f5f5;
      background: rgba(255,255,255,0.055);
      outline: none;
      transition: 0.25s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139,92,246,0.14);
      background: rgba(255,255,255,0.08);
    }

    input::placeholder,
    textarea::placeholder {
      color: #71717a;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    /* Product image upload */
    .upload-box {
      position: relative;
      margin-top: 8px;
      padding: 22px;
      border: 1px dashed rgba(167,139,250,0.45);
      border-radius: 16px;
      background: rgba(139,92,246,0.06);
      text-align: center;
      transition: 0.25s ease;
    }

    .upload-box:hover {
      border-color: #a78bfa;
      background: rgba(139,92,246,0.10);
    }

    .upload-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .upload-text {
      color: #c4b5fd;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .upload-subtext {
      color: #71717a;
      font-size: 13px;
      margin-bottom: 15px;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background: linear-gradient(
        135deg,
        #7c3aed,
        #4f46e5
      );
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 9px;
      margin-right: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .image-preview {
      display: none;
      margin-top: 18px;
      text-align: center;
    }

    .image-preview img {
      max-width: 180px;
      max-height: 180px;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 5px;
      color: #71717a;
      font-size: 13px;
    }

    .or-divider::before,
    .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    .section-note {
      font-size: 13px;
      color: #71717a;
      margin-top: 5px;
    }

    /* Buttons */
    button {
      margin-top: 20px;
      padding: 13px 18px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .primary {
      width: 100%;
      color: white;
      background: linear-gradient(
        135deg,
        #7c3aed,
        #4f46e5,
        #0891b2
      );
      box-shadow:
        0 10px 30px rgba(79,70,229,0.25);
    }

    .primary:hover {
      box-shadow:
        0 15px 40px rgba(79,70,229,0.40);
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: #e5e7eb;
      border: 1px solid rgba(255,255,255,0.10);
    }

    .secondary:hover {
      background: rgba(255,255,255,0.13);
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 15px;
      padding: 13px;
      border-radius: 11px;
      background: rgba(255,255,255,0.06);
      color: #d4d4d8;
      display: none;
      border: 1px solid rgba(255,255,255,0.07);
      line-height: 1.5;
    }

    /* Checkbox options */
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      padding: 12px;
      border-radius: 11px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: #d4d4d8;
      cursor: pointer;
    }

    .checkbox-item input {
      width: auto;
      accent-color: #8b5cf6;
    }

    /* Admin header */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .admin-header h1 {
      margin: 0;
      font-size: 25px;
    }

    .admin-status {
      color: #34d399;
      font-size: 13px;
      margin-top: 5px;
    }

    @media (max-width: 650px) {
      .container {
        width: 94%;
        margin: 20px auto;
      }

      .card {
        padding: 21px;
        border-radius: 17px;
      }

      .checkbox-group {
        grid-template-columns: 1fr;
      }

      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- Animated background -->
  <div class="stars">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
  </div>


  <div class="container">

    <!-- LOGIN -->
    <div class="card" id="loginCard">

      <div class="brand">
        <h1>QEVRI</h1>
        <p>Product Management</p>
      </div>

      <label>Email</label>

      <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="username"
      >


      <label>Password</label>

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >


      <button
        class="primary"
        id="loginButton"
      >
        Login
      </button>


      <div
        class="message"
        id="loginMessage"
      ></div>

    </div>


    <!-- ADMIN HEADER -->
    <div
      class="card hidden"
      id="adminCard"
    >

      <div class="admin-header">

        <div>

          <h1>
            QEVRI Product Admin
          </h1>

          <div class="admin-status">
            ● You are logged in
          </div>

        </div>


        <button
          class="secondary"
          id="logoutButton"
        >
          Logout
        </button>

      </div>

    </div>


    <!-- ADD PRODUCT -->
    <div
      class="card hidden"
      id="productCard"
    >

      <h2>
        ✨ Add Product
      </h2>


      <label>
        Product Name *
      </label>

      <input
        id="productName"
        type="text"
        placeholder="Enter product name"
      >


      <label>
        Description
      </label>

      <textarea
        id="description"
        placeholder="Write a short product description"
      ></textarea>


      <label>
        Retailer *
      </label>

      <input
        id="retailer"
        type="text"
        placeholder="Amazon, Flipkart, Myntra..."
      >


      <label>
        Category *
      </label>

      <input
        id="category"
        type="text"
        placeholder="Fashion, Electronics, Home..."
      >


      <label>
        Product URL *
      </label>

      <input
        id="productUrl"
        type="url"
        placeholder="https://..."
      >


      <!-- PRODUCT IMAGE -->
      <label>
        Product Image
      </label>

      <div class="upload-box">

        <div class="upload-icon">
          📷
        </div>

        <div class="upload-text">
          Upload product image
        </div>

        <div class="upload-subtext">
          Choose an image from your computer
        </div>


        <input
          id="productFile"
          type="file"
          accept="image/*"
        >


        <div
          class="image-preview"
          id="imagePreview"
        >

          <img
            id="previewImage"
            alt="Product preview"
          >

        </div>

      </div>


      <div class="or-divider">
        OR
      </div>


      <label>
        Image URL
      </label>

      <input
        id="imageUrl"
        type="url"
        placeholder="Paste product image URL"
      >

      <div class="section-note">
        You can either upload an image or paste an image URL.
      </div>


      <label>
        Affiliate URL
      </label>

      <input
        id="affiliateUrl"
        type="url"
        placeholder="Paste your affiliate link"
      >


      <label>
        Price
      </label>

      <input
        id="price"
        type="number"
        step="0.01"
        placeholder="0.00"
      >


      <label>
        Old Price
      </label>

      <input
        id="oldPrice"
        type="number"
        step="0.01"
        placeholder="0.00"
      >


      <label>
        Rating
      </label>

      <input
        id="rating"
        type="number"
        step="0.1"
        min="0"
        max="5"
        placeholder="0 - 5"
      >


      <label>
        Review Count
      </label>

      <input
        id="reviewCount"
        type="number"
        placeholder="Number of reviews"
      >


      <div class="checkbox-group">

        <label class="checkbox-item">
          <input
            id="isDeal"
            type="checkbox"
          >
          Show as Deal
        </label>


        <label class="checkbox-item">
          <input
            id="isTrending"
            type="checkbox"
          >
          Show as Trending
        </label>


        <label class="checkbox-item">
          <input
            id="isFeatured"
            type="checkbox"
          >
          Show as Featured
        </label>


        <label class="checkbox-item">
          <input
            id="isPublished"
            type="checkbox"
            checked
          >
          Published / Visible
        </label>

      </div>


      <button
        class="primary"
        id="addProductButton"
      >
        Add Product
      </button>


      <div
        class="message"
        id="productMessage"
      ></div>

    </div>

  </div>


  <script>

    /* =========================================
       SUPABASE CONFIGURATION
       ========================================= */

    const SUPABASE_URL =
      "https://thijdkyjgzxnwwdzdyil.supabase.co";


    /*
      IMPORTANT:

      Put your EXISTING Supabase publishable key
      between the quotation marks below.

      It should start with:
      sb_publishable_

      DO NOT use:
      sb_secret_
      service_role
    */

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_fKXeJA4MtgPnPWHGKLb5Iw_FCTknjoo";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================================
       ELEMENTS
       ========================================= */

    const loginCard =
      document.getElementById("loginCard");

    const adminCard =
      document.getElementById("adminCard");

    const productCard =
      document.getElementById("productCard");

    const loginMessage =
      document.getElementById("loginMessage");

    const productMessage =
      document.getElementById("productMessage");


    /* =========================================
       MESSAGE
       ========================================= */

    function showMessage(
      element,
      message
    ) {

      element.textContent = message;

      element.style.display = "block";

    }


    /* =========================================
       IMAGE PREVIEW
       ========================================= */

    document
      .getElementById("productFile")
      .addEventListener(
        "change",
        function () {

          const file =
            this.files[0];

          const previewBox =
            document.getElementById(
              "imagePreview"
            );

          const previewImage =
            document.getElementById(
              "previewImage"
            );


          if (!file) {

            previewBox.style.display =
              "none";

            previewImage.src = "";

            return;

          }


          if (
            !file.type.startsWith("image/")
          ) {

            showMessage(
              productMessage,
              "Please choose an image file."
            );

            this.value = "";

            previewBox.style.display =
              "none";

            return;

          }


          const reader =
            new FileReader();


          reader.onload =
            function (event) {

              previewImage.src =
                event.target.result;

              previewBox.style.display =
                "block";

            };


          reader.readAsDataURL(file);

        }
      );


    /* =========================================
       LOGIN
       ========================================= */

    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        async function () {

          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          if (!email || !password) {

            showMessage(
              loginMessage,
              "Please enter your email and password."
            );

            return;

          }


          showMessage(
            loginMessage,
            "Logging in..."
          );


          const {
            error
          } =
            await supabaseClient
              .auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (error) {

            showMessage(
              loginMessage,
              "Login failed: " +
              error.message
            );

            return;

          }


          loginCard.classList.add(
            "hidden"
          );

          adminCard.classList.remove(
            "hidden"
          );

          productCard.classList.remove(
            "hidden"
          );

        }
      );


    /* =========================================
       LOGOUT
       ========================================= */

    document
      .getElementById("logoutButton")
      .addEventListener(
        "click",
        async function () {

          await supabaseClient
            .auth
            .signOut();


          adminCard.classList.add(
            "hidden"
          );

          productCard.classList.add(
            "hidden"
          );

          loginCard.classList.remove(
            "hidden"
          );


          document
            .getElementById("email")
            .value = "";


          document
            .getElementById("password")
            .value = "";

        }
      );


    /* =========================================
       ADD PRODUCT
       ========================================= */

    document
      .getElementById("addProductButton")
      .addEventListener(
        "click",
        async function () {

          showMessage(
            productMessage,
            "Adding product..."
          );


          /* Product fields */

          const name =
            document
              .getElementById("productName")
              .value
              .trim();


          const description =
            document
              .getElementById("description")
              .value
              .trim();


          const retailer =
            document
              .getElementById("retailer")
              .value
              .trim();


          const category =
            document
              .getElementById("category")
              .value
              .trim();


          const productUrl =
            document
              .getElementById("productUrl")
              .value
              .trim();


          const affiliateUrl =
            document
              .getElementById("affiliateUrl")
              .value
              .trim() || null;


          const imageUrlInput =
            document
              .getElementById("imageUrl")
              .value
              .trim();


          const file =
            document
              .getElementById("productFile")
              .files[0];


          /* Required fields */

          if (
            !name ||
            !retailer ||
            !category ||
            !productUrl
          ) {

            showMessage(
              productMessage,
              "Please fill all fields marked with *."
            );

            return;

          }


          /* =====================================
             IMAGE HANDLING
             ===================================== */

          let finalImageUrl =
            imageUrlInput || null;


          /*
            If a file was selected,
            upload it to the existing
            product-images bucket.
          */

          if (file) {

            showMessage(
              productMessage,
              "Uploading product image..."
            );


            const extension =
              file.name
                .split(".")
                .pop()
                .toLowerCase();


            const uniqueName =
              crypto.randomUUID() +
              "." +
              extension;


            const filePath =
              "products/" +
              uniqueName;


            const {
              error: uploadError
            } =
              await supabaseClient
                .storage
                .from("product-images")
                .upload(
                  filePath,
                  file,
                  {
                    cacheControl: "3600",
                    upsert: false,
                    contentType: file.type
                  }
                );


            if (uploadError) {

              showMessage(
                productMessage,
                "Image upload failed: " +
                uploadError.message
              );

              return;

            }


            const {
              data: publicUrlData
            } =
              supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(
                  filePath
                );


            finalImageUrl =
              publicUrlData.publicUrl;

          }


          /* =====================================
             PRODUCT OBJECT
             ===================================== */

          const product = {

            name: name,

            description: description,

            retailer: retailer,

            category: category,

            product_url: productUrl,

            affiliate_url: affiliateUrl,

            image_url: finalImageUrl,

            price:
              document
                .getElementById("price")
                .value
                ? Number(
                    document
                      .getElementById("price")
                      .value
                  )
                : null,

            old_price:
              document
                .getElementById("oldPrice")
                .value
                ? Number(
                    document
                      .getElementById("oldPrice")
                      .value
                  )
                : null,

            rating:
              document
                .getElementById("rating")
                .value
                ? Number(
                    document
                      .getElementById("rating")
                      .value
                  )
                : null,

            review_count:
              document
                .getElementById("reviewCount")
                .value
                ? Number(
                    document
                      .getElementById("reviewCount")
                      .value
                  )
                : null,

            is_deal:
              document
                .getElementById("isDeal")
                .checked,

            is_trending:
              document
                .getElementById("isTrending")
                .checked,

            is_featured:
              document
                .getElementById("isFeatured")
                .checked,

            is_published:
              document
                .getElementById("isPublished")
                .checked

          };


          /* =====================================
             SAVE PRODUCT
             ===================================== */

          showMessage(
            productMessage,
            "Saving product..."
          );


          const {
            error
          } =
            await supabaseClient
              .from("products")
              .insert(product);


          if (error) {

            showMessage(
              productMessage,
              "Product could not be added: " +
              error.message
            );

            return;

          }


          /* Success */

          showMessage(
            productMessage,
            "✓ Product added successfully!"
          );


          /* =====================================
             RESET FORM
             ===================================== */

          document
            .querySelectorAll(
              "#productCard input, #productCard textarea"
            )
            .forEach(
              function(element) {

                if (
                  element.type === "checkbox"
                ) {

                  element.checked =
                    element.id ===
                    "isPublished";

                } else {

                  element.value = "";

                }

              }
            );


          document
            .getElementById(
              "imagePreview"
            )
            .style.display = "none";


          document
            .getElementById(
              "previewImage"
