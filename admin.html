<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QEVRI Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .login-box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    p {
      color: #666;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
    }

    .dashboard {
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-box" id="loginBox">

    <h1>QEVRI Admin</h1>

    <p>Sign in to continue.</p>

    <label for="email">Email</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label for="password">Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button id="loginButton" type="button">
      Login
    </button>

    <div id="message"></div>

  </div>


  <div class="login-box dashboard" id="dashboard">

    <h1>QEVRI Admin</h1>

    <p>✅ Login successful.</p>

    <p>You now have access to the QEVRI admin area.</p>

    <button id="logoutButton" type="button">
      Logout
    </button>

  </div>


  <script>

    const SUPABASE_URL =
      "https://thijdkyjgzxnwwdzdyil.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_rTNzWNRC8zmx8J7KSJXviQ_1GgmmXQ6";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const message =
      document.getElementById("message");


    loginButton.addEventListener(
      "click",
      async function () {

        const email =
          document.getElementById("email")
            .value
            .trim();

        const password =
          document.getElementById("password")
            .value;


        if (!email || !password) {

          message.textContent =
            "Please enter your email and password.";

          return;

        }


        message.textContent =
          "Logging in...";

        loginButton.disabled = true;


        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          console.error(error);

          message.textContent =
            "Login failed: " + error.message;

          loginButton.disabled = false;

          return;

        }


        console.log("Logged in:", data);

        document.getElementById("loginBox")
          .style.display = "none";

        document.getElementById("dashboard")
          .style.display = "block";

      }
    );


    logoutButton.addEventListener(
      "click",
      async function () {

        await supabaseClient.auth.signOut();

        document.getElementById("dashboard")
          .style.display = "none";

        document.getElementById("loginBox")
          .style.display = "block";

        message.textContent = "";

        loginButton.disabled = false;

      }
    );

  </script>

</body>
</html>
