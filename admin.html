<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QEVRI Admin</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================== */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .login-card h1 {
      margin: 0 0 8px;
    }

    .login-card p {
      color: #666;
      margin-bottom: 25px;
    }

    /* =========================
       COMMON
    ========================== */

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8d8d8;
      border-radius: 8px;
      background: white;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #111;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      background: #111;
      color: white;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.88;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #777;
    }

    .danger {
      background: #b42318;
    }

    .success {
      background: #16794b;
    }

    .message {
      margin-top: 15px;
      font-weight: 600;
      line-height: 1.5;
    }

    .error {
      color: #b42318;
    }

    .ok {
      color: #16794b;
    }

    /* =========================
       ADMIN
    ========================== */

    .admin-page {
      min-height: 100vh;
    }

    .topbar {
      background: #111;
      color: white;
      padding: 16px 24px;
    }

    .topbar-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 22px;
    }

    .topbar small {
      opacity: 0.7;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 25px;
      align-items: start;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 3px 18px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 5px;
    }

    .card-subtitle {
      color: #777;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .three-column {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
    }

    .checkbox-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .checkbox-box {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
    }

    .checkbox-box label {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      cursor: pointer;
    }

    .checkbox-box input {
      width: auto;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    /* =========================
       PRODUCT LIST
    ========================== */

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .toolbar input,
    .toolbar select {
      flex: 1;
      min-width: 150px;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-item {
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      padding: 15px;
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 15px;
      align-items: center;
    }

    .product-image {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      background: #eee;
    }

    .product-info h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }

    .product-info p {
      margin: 4px 0;
      color: #666;
      font-size: 13px;
    }

    .badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 7px;
    }

    .badge {
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 5px;
      background: #eee;
    }

    .badge.published {
      background: #dff6e9;
      color: #16794b;
    }

    .badge.hidden-badge {
      background: #eee;
      color: #666;
    }

    .product-actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .product-actions button {
      padding: 8px 12px;
      font-size: 13px;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px;
      border: 1px dashed #ccc;
      border-radius: 10px;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 900px) {

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 600px) {

      .two-column,
      .three-column,
      .checkbox-row {
        grid-template-columns: 1fr;
      }

      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .product-item {
        grid-template-columns: 60px 1fr;
      }

      .product-image {
        width: 60px;
        height: 60px;
      }

      .product-actions {
        grid-column: 1 / -1;
        flex-direction: row;
      }

    }
  </style>
</head>

<body>

  <!-- =====================================================
       LOGIN PAGE
  ====================================================== -->

  <div id="loginPage" class="login-page">

    <div class="login-card">

      <h1>QEVRI Admin</h1>

      <p>Sign in to manage QEVRI products.</p>

      <label for="loginEmail">
        Email
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Admin email"
        autocomplete="email"
      >

      <label for="loginPassword">
        Password
      </label>

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        type="button"
        style="width:100%; margin-top:22px;"
      >
        Login
      </button>

      <div
        id="loginMessage"
        class="message">
      </div>

    </div>

  </div>


  <!-- =====================================================
       ADMIN PAGE
  ====================================================== -->

  <div id="adminPage" class="admin-page hidden">

    <div class="topbar">

      <div class="topbar-inner">

        <div>
          <h1>QEVRI Admin</h1>
          <small>Product Management</small>
        </div>

        <button
          id="logoutButton"
          class="secondary"
          type="button"
        >
          Logout
        </button>

      </div>

    </div>


    <div class="container">

      <div class="dashboard-grid">


        <!-- =================================================
             PRODUCT FORM
        ================================================== -->

        <div class="card">

          <h2 id="formTitle">
            Add Product
          </h2>

          <p class="card-subtitle">
            Enter product information below.
          </p>


          <input
            id="productId"
            type="hidden"
          >


          <label for="productName">
            Product Name *
          </label>

          <input
            id="productName"
            type="text"
            placeholder="Example: GoSriKi Women's Kurta Set"
          >


          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            placeholder="Enter product description"
          ></textarea>


          <div class="two-column">

            <div>

              <label for="retailer">
                Retailer *
              </label>

              <input
                id="retailer"
                type="text"
                placeholder="Amazon"
              >

            </div>


            <div>

              <label for="category">
                Category *
              </label>

              <input
                id="category"
                type="text"
                placeholder="Fashion"
              >

            </div>

          </div>


          <label for="productUrl">
            Product URL *
          </label>

          <input
            id="productUrl"
            type="url"
            placeholder="https://..."
          >


          <label for="affiliateUrl">
            Affiliate URL
          </label>

          <input
            id="affiliateUrl"
            type="url"
            placeholder="Your Amazon affiliate link"
          >


          <label for="imageUrl">
            Image URL
          </label>

          <input
            id="imageUrl"
            type="url"
            placeholder="https://..."
          >


          <div class="three-column">

            <div>

              <label for="price">
                Price
              </label>

              <input
                id="price"
                type="number"
                step="0.01"
                placeholder="999"
              >

            </div>


            <div>

              <label for="oldPrice">
                Old Price
              </label>

              <input
                id="oldPrice"
                type="number"
                step="0.01"
                placeholder="1499"
              >

            </div>


            <div>

              <label for="rating">
                Rating
              </label>

              <input
                id="rating"
                type="number"
                step="0.1"
                min="0"
                max="5"
                placeholder="4.5"
              >

            </div>

          </div>


          <label for="reviewCount">
            Review Count
          </label>

          <input
            id="reviewCount"
            type="number"
            placeholder="1250"
          >


          <div class="checkbox-row">

            <div class="checkbox-box">

              <label>
                <input
                  id="isDeal"
                  type="checkbox"
                >
                Show as Deal
              </label>

            </div>


            <div class="checkbox-box">

              <label>
                <input
                  id="isTrending"
                  type="checkbox"
                >
                Show as Trending
              </label>

            </div>


            <div class="checkbox-box">

              <label>
                <input
                  id="isFeatured"
                  type="checkbox"
                >
                Show as Featured
              </label>

            </div>


            <div class="checkbox-box">

              <label>
                <input
                  id="isPublished"
                  type="checkbox"
                  checked
                >
                Published / Visible
              </label>

            </div>

          </div>


          <div class="form-buttons">

            <button
              id="saveButton"
              type="button"
            >
              Add Product
            </button>

            <button
              id="clearButton"
              class="secondary"
              type="button"
            >
              Clear
            </button>

          </div>


          <div
            id="formMessage"
            class="message">
          </div>

        </div>


        <!-- =================================================
             PRODUCT LIST
        ================================================== -->

        <div class="card">

          <h2>
            Your Products
          </h2>

          <p class="card-subtitle">
            Products already saved in QEVRI.
          </p>


          <div class="toolbar">

            <input
              id="searchInput"
              type="search"
              placeholder="Search products..."
            >

            <select id="statusFilter">

              <option value="all">
                All Products
              </option>

              <option value="published">
                Published
              </option>

              <option value="hidden">
                Hidden
              </option>

            </select>

          </div>


          <div
            id="productList"
            class="product-list">

            <div class="loading">
              Loading products...
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    /* =====================================================
       SUPABASE CONFIGURATION
    ====================================================== */

    const SUPABASE_URL =
      "https://thijdkyjgzxnwwdzdyil.supabase.co";


    /*
      IMPORTANT:

      Replace ONLY the text below with your
      Supabase PUBLISHABLE KEY.

      It starts with:

      sb_publishable_
    */

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_fKXeJA4MtgPnPWHGKLb5Iw_FCTknjoo";


    /* =====================================================
       SUPABASE CLIENT
    ====================================================== */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const loginPage =
      document.getElementById("loginPage");

    const adminPage =
      document.getElementById("adminPage");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const saveButton =
      document.getElementById("saveButton");

    const clearButton =
      document.getElementById("clearButton");

    const loginMessage =
      document.getElementById("loginMessage");

    const formMessage =
      document.getElementById("formMessage");

    const productList =
      document.getElementById("productList");

    const searchInput =
      document.getElementById("searchInput");

    const statusFilter =
      document.getElementById("statusFilter");


    /* =====================================================
       LOGIN
    ====================================================== */

    async function login() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;


      if (!email || !password) {

        loginMessage.className =
          "message error";

        loginMessage.textContent =
          "Please enter your email and password.";

        return;

      }


      loginButton.disabled = true;

      loginMessage.className =
        "message";

      loginMessage.textContent =
        "Logging in...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          console.error(
            "Login error:",
            error
          );

          loginMessage.className =
            "message error";

          loginMessage.textContent =
            "Login failed: " +
            error.message;

          loginButton.disabled = false;

          return;

        }


        if (!data.session) {

          loginMessage.className =
            "message error";

          loginMessage.textContent =
            "Login did not create a session.";

          loginButton.disabled = false;

          return;

        }


        loginMessage.textContent = "";

        showAdmin();

        await loadProducts();


      } catch (error) {

        console.error(error);

        loginMessage.className =
          "message error";

        loginMessage.textContent =
          "Login error: " +
          error.message;

      }


      loginButton.disabled = false;

    }


    /* =====================================================
       SHOW ADMIN
    ====================================================== */

    function showAdmin() {

      loginPage.classList.add("hidden");

      adminPage.classList.remove("hidden");

    }


    /* =====================================================
       SHOW LOGIN
    ====================================================== */

    function showLogin() {

      adminPage.classList.add("hidden");

      loginPage.classList.remove("hidden");

    }


    /* =====================================================
       CHECK EXISTING SESSION
    ====================================================== */

    async function checkSession() {

      try {

        const {
          data
        } =
          await supabaseClient.auth.getSession();


        if (data.session) {

          showAdmin();

          await loadProducts();

        } else {

          showLogin();

        }

      } catch (error) {

        console.error(
          "Session error:",
          error
        );

        showLogin();

      }

    }


    /* =====================================================
       LOGOUT
    ====================================================== */

    async function logout() {

      await supabaseClient.auth.signOut();

      clearForm();

      showLogin();

      loginMessage.textContent =
        "Logged out.";

    }


    /* =====================================================
       GET FORM DATA
    ====================================================== */

    function getFormData() {

      const data = {

        name:
          document
            .getElementById("productName")
            .value
            .trim(),

        description:
          document
            .getElementById("description")
            .value
            .trim(),

        retailer:
          document
            .getElementById("retailer")
            .value
            .trim(),

        product_url:
          document
            .getElementById("productUrl")
            .value
            .trim(),

        affiliate_url:
          document
            .getElementById("affiliateUrl")
            .value
            .trim(),

        image_url:
          document
            .getElementById("imageUrl")
            .value
            .trim(),

        category:
          document
            .getElementById("category")
            .value
            .trim(),

        price:
          document
            .getElementById("price")
            .value,

        old_price:
          document
            .getElementById("oldPrice")
            .value,

        rating:
          document
            .getElementById("rating")
            .value,

        review_count:
          document
            .getElementById("reviewCount")
            .value,

        is_deal:
          document
            .getElementById("isDeal")
            .checked,

        is_trending:
          document
            .getElementById("isTrending")
            .checked,

        is_featured:
          document
            .getElementById("isFeatured")
            .checked,

        is_published:
          document
            .getElementById("isPublished")
            .checked

      };


      return data;

    }


    /* =====================================================
       SAVE PRODUCT
    ====================================================== */

    async function saveProduct() {

      const data =
        getFormData();


      if (
        !data.name ||
        !data.retailer ||
        !data.product_url ||
        !data.category
      ) {

        formMessage.className =
          "message error";

        formMessage.textContent =
          "Please fill Product Name, Retailer, Product URL and Category.";

        return;

      }


      const productId =
        document
          .getElementById("productId")
          .value;


      saveButton.disabled = true;

      formMessage.className =
        "message";

      formMessage.textContent =
        productId
          ? "Updating product..."
          : "Adding product...";


      try {

        const payload = {

          name:
            data.name,

          description:
            data.description || null,

          retailer:
            data.retailer,

          product_url:
            data.product_url,

          affiliate_url:
            data.affiliate_url || null,

          image_url:
            data.image_url || null,

          category:
            data.category,

          price:
            data.price
              ? Number(data.price)
              : null,

          old_price:
            data.old_price
              ? Number(data.old_price)
              : null,

          rating:
            data.rating
              ? Number(data.rating)
              : null,

          review_count:
            data.review_count
              ? Number(data.review_count)
              : null,

          is_deal:
            data.is_deal,

          is_trending:
            data.is_trending,

          is_featured:
            data.is_featured,

          is_published:
            data.is_published

        };


        let result;


        /* UPDATE */

        if (productId) {

          result =
            await supabaseClient
              .from("products")
              .update(payload)
              .eq(
                "id",
                productId
              );

        }

        /* INSERT */

        else {

          result =
            await supabaseClient
              .from("products")
              .insert(payload);

        }


        if (result.error) {

          console.error(
            "Database error:",
            result.error
          );

          formMessage.className =
            "message error";

          formMessage.textContent =
            "Database error: " +
            result.error.message;

          saveButton.disabled = false;

          return;

        }


        formMessage.className =
          "message ok";

        formMessage.textContent =
          productId
            ? "✅ Product updated successfully!"
            : "✅ Product added successfully!";


        clearForm();

        await loadProducts();


      } catch (error) {

        console.error(error);

        formMessage.className =
          "message error";

        formMessage.textContent =
          "Error: " +
          error.message;

      }


      saveButton.disabled = false;

    }


    /* =====================================================
       LOAD PRODUCTS
    ====================================================== */

    async function loadProducts() {

      productList.innerHTML =
        '<div class="loading">Loading products...</div>';


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("products")
            .select("*")
            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (error) {

          console.error(
            "Load products error:",
            error
          );

          productList.innerHTML =
            `
            <div class="empty">
              <strong>Could not load products.</strong>
              <br><br>
              ${escapeHtml(error.message)}
            </div>
            `;

          return;

        }


        window.qevriProducts =
          data || [];

        renderProducts();


      } catch (error) {

        console.error(error);

        productList.innerHTML =
          `
          <div class="empty">
            Error loading products:
            ${escapeHtml(error.message)}
          </div>
          `;

      }

    }


    /* =====================================================
       RENDER PRODUCTS
    ====================================================== */

    function renderProducts() {

      const products =
        window.qevriProducts || [];


      const search =
        searchInput
          .value
          .trim()
          .toLowerCase();


      const status =
        statusFilter.value;


      const filtered =
        products.filter(
          function(product) {

            const matchesSearch =
              !search ||
              String(product.name || "")
                .toLowerCase()
                .includes(search) ||
              String(product.category || "")
                .toLowerCase()
                .includes(search) ||
              String(product.retailer || "")
                .toLowerCase()
                .includes(search);


            const published =
              product.is_published !== false;


            const matchesStatus =
              status === "all" ||
              (status === "published" && published) ||
              (status === "hidden" && !published);


            return (
              matchesSearch &&
              matchesStatus
            );

          }
        );


      if (!filtered.length) {

        productList.innerHTML =
          `
          <div class="empty">
            No products found.
          </div>
          `;

        return;

      }


      productList.innerHTML =
        filtered
          .map(
            createProductCard
          )
          .join("");

    }


    /* =====================================================
       PRODUCT CARD
    ====================================================== */

    function createProductCard(product) {

      const image =
        product.image_url ||
        "https://via.placeholder.com/80?text=QEVRI";


      const published =
        product.is_published !== false;


      let badges = "";


      if (published) {

        badges +=
          '<span class="badge published">Published</span>';

      } else {

        badges +=
          '<span class="badge hidden-badge">Hidden</span>';

      }


      if (product.is_deal) {

        badges +=
          '<span class="badge">Deal</span>';

      }


      if (product.is_trending) {

        badges +=
          '<span class="badge">Trending</span>';

      }


      if (product.is_featured) {

        badges +=
          '<span class="badge">Featured</span>';

      }


      return `

        <div class="product-item">

          <img
            class="product-image"
            src="${escapeAttribute(image)}"
            alt=""
            onerror="this.src='https://via.placeholder.com/80?text=QEVRI'"
          >

          <div class="product-info">

            <h3>
              ${escapeHtml(product.name || "Unnamed product")}
            </h3>

            <p>
              ${escapeHtml(product.retailer || "")}
              •
              ${escapeHtml(product.category || "")}
            </p>

            <p>
              ${
                product.price !== null &&
                product.price !== undefined
                  ? "₹" + product.price
                  : "Price not added"
              }
            </p>

            <div class="badges">
              ${badges}
            </div>

          </div>

          <div class="product-actions">

            <button
              type="button"
              onclick="editProduct(${Number(product.id)})"
            >
              Edit
            </button>

            <button
              type="button"
              class="${published ? "secondary" : "success"}"
              onclick="togglePublished(${Number(product.id)}, ${published})"
            >
              ${published ? "Hide" : "Publish"}
            </button>

            <button
              type="button"
              class="danger"
              onclick="deleteProduct(${Number(product.id)})"
            >
              Delete
            </button>

          </div>

        </div>

      `;

    }


    /* =====================================================
       EDIT PRODUCT
    ====================================================== */

    function editProduct(id) {

      const product =
        (window.qevriProducts || [])
          .find(
            function(item) {

              return Number(item.id) ===
                Number(id);

            }
          );


      if (!product) {

        return;

      }


      document
        .getElementById("productId")
        .value =
        product.id || "";


      document
        .getElementById("productName")
        .value =
        product.name || "";


      document
        .getElementById("description")
        .value =
        product.description || "";


      document
        .getElementById("retailer")
        .value =
        product.retailer || "";


      document
        .getElementById("category")
        .value =
        product.category || "";


      document
        .getElementById("productUrl")
        .value =
        product.product_url || "";


      document
        .getElementById("affiliateUrl")
        .value =
        product.affiliate_url || "";


      document
        .getElementById("imageUrl")
        .value =
        product.image_url || "";


      document
        .getElementById("price")
        .value =
        product.price ?? "";


      document
        .getElementById("oldPrice")
        .value =
        product.old_price ?? "";


      document
        .getElementById("rating")
        .value =
        product.rating ?? "";


      document
        .getElementById("reviewCount")
        .value =
        product.review_count ?? "";


      document
        .getElementById("isDeal")
        .checked =
        product.is_deal === true;


      document
        .getElementById("isTrending")
        .checked =
        product.is_trending === true;


      document
        .getElementById("isFeatured")
        .checked =
        product.is_featured === true;


      document
        .getElementById("isPublished")
        .checked =
        product.is_published !== false;


      document
        .getElementById("formTitle")
        .textContent =
        "Edit Product";


      saveButton.textContent =
        "Update Product";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =====================================================
       TOGGLE PUBLISHED
    ====================================================== */

    async function togglePublished(
      id,
      currentValue
    ) {

      try {

        const {
          error
        } =
          await supabaseClient
            .from("products")
            .update({

              is_published:
                !currentValue

            })
            .eq(
              "id",
              id
            );


        if (error) {

          alert(
            "Could not update product: " +
            error.message
          );

          return;

        }


        await loadProducts();


      } catch (error) {

        alert(
          "Error: " +
          error.message
        );

      }

    }


    /* =====================================================
       DELETE PRODUCT
    ====================================================== */

    async function deleteProduct(id) {

      const confirmed =
        confirm(
          "Are you sure you want to delete this product?"
        );


      if (!confirmed) {

        return;

      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("products")
            .delete()
            .eq(
              "id",
              id
            );


        if (error) {

          alert(
            "Could not delete product: " +
            error.message
          );

          return;

        }


        await loadProducts();


      } catch (error) {

        alert(
          "Error: " +
          error.message
        );

      }

    }


    /* =====================================================
       CLEAR FORM
    ====================================================== */

    function clearForm() {

      document
        .getElementById("productId")
        .value = "";


      document
        .getElementById("productName")
        .value = "";


      document
        .getElementById("description")
        .value = "";


      document
        .getElementById("retailer")
        .value = "";


      document
        .getElementById("category")
        .value = "";


      document
        .getElementById("productUrl")
        .value = "";


      document
        .getElementById("affiliateUrl")
        .value = "";


      document
        .getElementById("imageUrl")
        .value = "";


      document
        .getElementById("price")
        .value = "";


      document
        .getElementById("oldPrice")
        .value = "";


      document
        .getElementById("rating")
        .value = "";


      document
        .getElementById("reviewCount")
        .value = "";


      document
        .getElementById("isDeal")
        .checked = false;


      document
        .getElementById("isTrending")
        .checked = false;


      document
        .getElementById("isFeatured")
        .checked = false;


      document
        .getElementById("isPublished")
        .checked = true;


      document
        .getElementById("formTitle")
        .textContent =
        "Add Product";


      saveButton.textContent =
        "Add Product";

    }


    /* =====================================================
       ESCAPE HTML
    ====================================================== */

    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function escapeAttribute(value) {

      return escapeHtml(value);

    }


    /* =====================================================
       EVENTS
    ====================================================== */

    loginButton.addEventListener(
      "click",
      login
    );


    logoutButton.addEventListener(
      "click",
      logout
    );


    saveButton.addEventListener(
      "click",
      saveProduct
    );


    clearButton.addEventListener(
      "click",
      function() {

        clearForm();

        formMessage.textContent = "";

      }
    );


    searchInput.addEventListener(
      "input",
      renderProducts
    );


    statusFilter.addEventListener(
      "change",
      renderProducts
    );


    /* =====================================================
       START
    ====================================================== */

    checkSession();

  </script>

</body>
</html>
