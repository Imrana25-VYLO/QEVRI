<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QEVRI Admin Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .box {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #111;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>QEVRI Admin</h1>

  <p>Login test</p>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button onclick="testLogin()">
    Login
  </button>

  <div id="status">
    Page loaded successfully.
  </div>

</div>

<script>

function testLogin() {

  const status = document.getElementById("status");

  status.textContent = "Button is working!";

  status.style.color = "green";

}

</script>

</body>
</html>
