<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QEVRI Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #222;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
    }

    .primary {
      background: #111;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f1f1;
      display: none;
    }

    .product-grid {
      display: grid;
      gap: 15px;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 15px;
    }

    .product strong {
      display: block;
      margin-bottom: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginCard">

    <h1>QEVRI Admin</h1>

    <p>Sign in to manage QEVRI products.</p>

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="Admin email"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button class="primary" id="loginButton">
      Login
    </button>

    <div class="message" id="loginMessage"></div>

  </div>


  <!-- ADMIN -->
  <div class="card hidden" id="adminCard">

    <h1>QEVRI Product Admin</h1>

    <p>You are logged in.</p>

    <button class="secondary" id="logoutButton">
      Logout
    </button>

  </div>


  <!-- ADD PRODUCT -->
  <div class="card hidden" id="productCard">

    <h2>Add Product</h2>

    <label>Product Name *</label>
    <input id="productName" type="text">

    <label>Description</label>
    <textarea id="description"></textarea>

    <label>Retailer *</label>
    <input id="retailer" type="text">

    <label>Category *</label>
    <input id="category" type="text">

    <label>Product URL *</label>
    <input id="productUrl" type="url">

    <label>Affiliate URL</label>
    <input id="affiliateUrl" type="url">

    <label>Image URL</label>
    <input id="imageUrl" type="url">

    <label>Price</label>
    <input id="price" type="number" step="0.01">

    <label>Old Price</label>
    <input id="oldPrice" type="number" step="0.01">

    <label>Rating</label>
    <input id="rating" type="number" step="0.1" min="0" max="5">

    <label>Review Count</label>
    <input id="reviewCount" type="number">

    <label>
      <input id="isDeal" type="checkbox">
      Show as Deal
    </label>

    <label>
      <input id="isTrending" type="checkbox">
      Show as Trending
    </label>

    <label>
      <input id="isFeatured" type="checkbox">
      Show as Featured
    </label>

    <label>
      <input id="isPublished" type="checkbox" checked>
      Published / Visible
    </label>

    <button class="primary" id="addProductButton">
      Add Product
    </button>

    <div class="message" id="productMessage"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://thijdkyjgzxnwwdzdyil.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_fKXeJA4MtgPnPWHGKLb5Iw_FCTknjoo";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const loginCard =
  document.getElementById("loginCard");

const adminCard =
  document.getElementById("adminCard");

const productCard =
  document.getElementById("productCard");

const loginMessage =
  document.getElementById("loginMessage");

const productMessage =
  document.getElementById("productMessage");


function showMessage(element, message) {
  element.textContent = message;
  element.style.display = "block";
}


document
  .getElementById("loginButton")
  .addEventListener("click", async function () {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      showMessage(
        loginMessage,
        "Please enter your email and password."
      );
      return;
    }

    showMessage(
      loginMessage,
      "Logging in..."
    );

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      showMessage(
        loginMessage,
        "Login failed: " + error.message
      );

      return;
    }

    loginCard.classList.add("hidden");

    adminCard.classList.remove("hidden");

    productCard.classList.remove("hidden");

  });


document
  .getElementById("logoutButton")
  .addEventListener("click", async function () {

    await supabaseClient.auth.signOut();

    adminCard.classList.add("hidden");

    productCard.classList.add("hidden");

    loginCard.classList.remove("hidden");

    document.getElementById("email").value = "";

    document.getElementById("password").value = "";

  });


document
  .getElementById("addProductButton")
  .addEventListener("click", async function () {

    showMessage(
      productMessage,
      "Adding product..."
    );

    const product = {

      name:
        document.getElementById("productName").value.trim(),

      description:
        document.getElementById("description").value.trim(),

      retailer:
        document.getElementById("retailer").value.trim(),

      category:
        document.getElementById("category").value.trim(),

      product_url:
        document.getElementById("productUrl").value.trim(),

      affiliate_url:
        document.getElementById("affiliateUrl").value.trim() || null,

      image_url:
        document.getElementById("imageUrl").value.trim() || null,

      price:
        document.getElementById("price").value
          ? Number(document.getElementById("price").value)
          : null,

      old_price:
        document.getElementById("oldPrice").value
          ? Number(document.getElementById("oldPrice").value)
          : null,

      rating:
        document.getElementById("rating").value
          ? Number(document.getElementById("rating").value)
          : null,

      review_count:
        document.getElementById("reviewCount").value
          ? Number(document.getElementById("reviewCount").value)
          : null,

      is_deal:
        document.getElementById("isDeal").checked,

      is_trending:
        document.getElementById("isTrending").checked,

      is_featured:
        document.getElementById("isFeatured").checked,

      is_published:
        document.getElementById("isPublished").checked

    };


    if (
      !product.name ||
      !product.retailer ||
      !product.category ||
      !product.product_url
    ) {

      showMessage(
        productMessage,
        "Please fill all fields marked with *."
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("products")
        .insert(product);


    if (error) {

      showMessage(
        productMessage,
        "Product could not be added: " +
        error.message
      );

      return;
    }


    showMessage(
      productMessage,
      "Product added successfully!"
    );


    document
      .querySelectorAll("#productCard input, #productCard textarea")
      .forEach(function(element) {

        if (element.type === "checkbox") {
          element.checked =
            element.id === "isPublished";
        } else {
          element.value = "";
        }

      });

  });

</script>

</body>
</html>
